services:
  oracle-db:
    build:
      context: .
      dockerfile: oracle/Dockerfile
    platform: linux/arm64
    image: dsa-sql-jpa-oracle:free-slim-faststart
    container_name: dsa-sql-jpa-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: games
      APP_USER_PASSWORD: games
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
