### REST Data HTTP service
server.port=8090
server.servlet.context-path=/DSA-SQL-JDBCService/rest

### JDBC Data Source
jdbc.data.source.DB_URL=${JDBC_DATA_SOURCE_DB_URL:jdbc:postgresql://localhost:55432/sia21}
jdbc.data.source.USER=${JDBC_DATA_SOURCE_USER:sia}
jdbc.data.source.PASS=${JDBC_DATA_SOURCE_PASS:sia}
## jdbc.data.source.JDBC_DRIVER

# logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
logging.level.org.hibernate.SQL=debug

# SpringBoot Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.security.user.name=developer
spring.security.user.password=iis
