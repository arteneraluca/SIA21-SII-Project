services:
  postgres:
    build:
      context: .
      dockerfile: postgresql/Dockerfile
    container_name: dsa-sql-jdbcservice-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sia21
      POSTGRES_USER: sia
      POSTGRES_PASSWORD: sia
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sia -d sia21"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dsa-sql-jdbcservice-postgres-data:/var/lib/postgresql/data

volumes:
  dsa-sql-jdbcservice-postgres-data:
